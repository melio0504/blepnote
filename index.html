<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlepNote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/src/oneko.js" defer></script>
</head>
<body class="font-sans bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
    <div class="relative min-h-[90vh]">
        <div class="absolute inset-0 z-0">
            <img src="assets/images/hero-bg.jpg" alt="Decorative background" 
                    class="w-full h-full object-cover object-center">
            <div class="absolute inset-0"></div>
        </div>
    <nav class="bg-white/50 backdrop-blur-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex flex-col md:flex-row justify-center items-center space-y-4 md:space-y-0">
                <a href="/" class="md:absolute md:left-6">
                    <img src="assets/images/logo.svg" alt="BlepNote Logo" class="h-10">
                </a>
                <div class="flex flex-wrap justify-center items-center space-x-0 space-y-2 md:space-y-0 md:space-x-8">
                    <a href="#" class="px-4 py-2 text-gray-700 hover:text-blue-600">Home</a>
                    <a href="#" class="px-4 py-2 text-gray-700 hover:text-blue-600">Features</a>
                    <a href="#" class="px-4 py-2 text-gray-700 hover:text-blue-600">How it Works</a>
                    <a href="#" class="px-4 py-2 text-gray-700 hover:text-blue-600">About</a>
                    <a href="#" class="px-4 py-2 text-gray-700 hover:text-blue-600">FAQ</a>
                </div>
                <div class="md:absolute md:right-6 mt-4 md:mt-0">
                    <a href="#" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-full text-base transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-50 shadow-md hover:shadow-lg">
                        Try it!
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-6 py-32 relative z-10">
        <div class="max-w-2xl ml-auto mr-0 md:mr-12 lg:mr-24 text-right">
            <h2 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-8 md:mb-10 text-white leading-tight">
                Feels like home.
            </h2>
            <p class="text-xl md:text-2xl lg:text-3xl mb-10 md:mb-12 leading-relaxed md:leading-relaxed text-white/90">
                Track your mood, journal<br class="hidden md:block">
                your thoughts, and bond<br class="hidden md:block">
                with your virtual pet on<br class="hidden md:block">
                your journey to self-care.
            </p>
            <button id="getStartedBtn" class="bg-yellow-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-full text-lg transition duration-300 transform hover:scale-105">
                Get Started
            </button>
        </div>
    </div>
    </div>
    <script>
        document.querySelectorAll('#faq button').forEach(button => {
            button.addEventListener('click', () => {
                const answer = button.nextElementSibling;
                const icon = button.querySelector('svg');
                
                answer.classList.toggle('hidden');
                icon.classList.toggle('rotate-180');
            });
        });
    </script>
</body>
</html>
